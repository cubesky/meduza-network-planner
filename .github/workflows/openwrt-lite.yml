name: build-openwrt-lite

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      ipk_release:
        description: OpenWrt release used to build IPK
        required: true
        default: "24.10.0"
        type: string
      apk_release:
        description: OpenWrt release used to build APK
        required: true
        default: "25.12.2"
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: openwrt-lite-${{ github.ref }}-native-grpc
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      affected: ${{ steps.decide.outputs.affected }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect OpenWrt package changes
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}
        uses: dorny/paths-filter@v3
        with:
          filters: |
            affected:
              - 'alternative/openwrt-lite/**'
              - '.github/workflows/openwrt-lite.yml'

      - name: Decide whether to build OpenWrt package
        id: decide
        shell: bash
        env:
          FILTER_RESULT: ${{ steps.filter.outputs.affected }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" || "${GITHUB_REF}" == refs/tags/* ]]; then
            affected=true
          else
            affected="${FILTER_RESULT:-false}"
          fi
          echo "affected=${affected}" >>"${GITHUB_OUTPUT}"
          if [[ "${affected}" != "true" ]]; then
            echo "OpenWrt build skipped: no OpenWrt package files changed."
          fi

  test:
    name: OpenWrt Lite lifecycle tests
    runs-on: ubuntu-24.04
    needs: changes
    if: ${{ needs.changes.outputs.affected == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check shell and Python syntax
        shell: bash
        run: |
          sh -n alternative/openwrt-lite/files/etc/init.d/meduza
          sh -n alternative/openwrt-lite/files/usr/libexec/meduza/meduza-lib.sh
          sh -n alternative/openwrt-lite/files/usr/libexec/meduza/meduza-generator
          sh -n alternative/openwrt-lite/files/usr/libexec/meduza/meduza-recover
          sh -n alternative/openwrt-lite/files/usr/libexec/meduza/meduza-openwrt-sync
          python3 -m py_compile \
            alternative/openwrt-lite/files/usr/libexec/meduza/meduza-agent.py \
            alternative/openwrt-lite/files/usr/libexec/meduza/meduza-json.py \
            alternative/openwrt-lite/files/usr/libexec/meduza/meduza-uci-session.py

      - name: Test ownership, recovery and OpenClash-safe UCI sync
        run: sh alternative/openwrt-lite/tests/run.sh

  build:
    name: OpenWrt ${{ matrix.release }} ${{ matrix.package_format }} ${{ matrix.package_arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: [changes, test]
    if: ${{ needs.changes.outputs.affected == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_format: ipk
            release: ${{ inputs.ipk_release || '24.10.0' }}
            target: armsr
            subtarget: armv8
            package_arch: arm64
            metadata_arch: aarch64_generic
            python_abi: "311"
            grpc_platform: musllinux_1_2_aarch64
          - package_format: ipk
            release: ${{ inputs.ipk_release || '24.10.0' }}
            target: x86
            subtarget: "64"
            package_arch: x86-64
            metadata_arch: x86_64
            python_abi: "311"
            grpc_platform: musllinux_1_2_x86_64
          - package_format: apk
            release: ${{ inputs.apk_release || '25.12.2' }}
            target: armsr
            subtarget: armv8
            package_arch: arm64
            metadata_arch: noarch
            python_abi: "313"
            grpc_platform: musllinux_1_2_aarch64
          - package_format: apk
            release: ${{ inputs.apk_release || '25.12.2' }}
            target: x86
            subtarget: "64"
            package_arch: x86-64
            metadata_arch: noarch
            python_abi: "313"
            grpc_platform: musllinux_1_2_x86_64
    env:
      OPENWRT_RELEASE: ${{ matrix.release }}
      OPENWRT_TARGET: ${{ matrix.target }}
      OPENWRT_SUBTARGET: ${{ matrix.subtarget }}
      PACKAGE_ARCH: ${{ matrix.package_arch }}
      PACKAGE_METADATA_ARCH: ${{ matrix.metadata_arch }}
      PYTHON_ABI: ${{ matrix.python_abi }}
      GRPC_PLATFORM: ${{ matrix.grpc_platform }}
      PACKAGE_FORMAT: ${{ matrix.package_format }}
      DOWNLOAD_DIR: ${{ github.workspace }}/.openwrt-downloads

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SDK host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses-dev libssl-dev patchelf python3 python3-pip python3-setuptools rsync \
            unzip zlib1g-dev file wget curl jq zstd

      - name: Cache OpenWrt SDK archive and downloads
        uses: actions/cache@v4
        with:
          path: |
            .openwrt-downloads
          key: openwrt-sdk-${{ env.OPENWRT_RELEASE }}-${{ env.OPENWRT_TARGET }}-${{ env.OPENWRT_SUBTARGET }}-${{ runner.os }}

      - name: Download and verify OpenWrt SDK
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          base="https://downloads.openwrt.org/releases/${OPENWRT_RELEASE}/targets/${OPENWRT_TARGET}/${OPENWRT_SUBTARGET}"
          mkdir -p "${DOWNLOAD_DIR}"

          sdk_name="$(curl --fail --silent --show-error --location "${base}/" \
            | grep -oE 'openwrt-sdk-[^" ]+\.tar\.(zst|xz)' \
            | sort -u \
            | head -n 1)"
          test -n "${sdk_name}"
          sdk_archive="${DOWNLOAD_DIR}/${sdk_name}"

          if [ ! -s "${sdk_archive}" ]; then
            curl --fail --show-error --location --retry 3 \
              --output "${sdk_archive}" "${base}/${sdk_name}"
          fi
          curl --fail --show-error --location --retry 3 \
            --output "${DOWNLOAD_DIR}/sha256sums" "${base}/sha256sums"
          expected="$(awk -v name="${sdk_name}" '
            {
              file=$2
              if (substr(file, 1, 1) == "*") file=substr(file, 2)
              if (substr(file, 1, 2) == "./") file=substr(file, 3)
              if (file == name) { print $1; exit }
            }
          ' "${DOWNLOAD_DIR}/sha256sums")"
          if [ -z "${expected}" ]; then
            echo "SDK checksum entry not found: ${sdk_name}" >&2
            grep -F "${sdk_name}" "${DOWNLOAD_DIR}/sha256sums" >&2 || true
            exit 1
          fi
          printf '%s  %s\n' "${expected}" "${sdk_archive}" | sha256sum --check

          rm -rf openwrt-sdk
          mkdir openwrt-sdk
          tar --extract --file "${sdk_archive}" --directory openwrt-sdk --strip-components=1
          mkdir -p "${DOWNLOAD_DIR}/dl"
          rm -rf openwrt-sdk/dl
          ln -s "${DOWNLOAD_DIR}/dl" openwrt-sdk/dl
          echo "sdk_name=${sdk_name}" >>"${GITHUB_OUTPUT}"

      - name: Install Meduza package definition
        shell: bash
        run: |
          set -euo pipefail
          rm -rf alternative/openwrt-lite/vendor vendor-wheels vendor-sources
          mkdir -p alternative/openwrt-lite/vendor/{etcd3,grpcio,protobuf,six,tenacity,typing-extensions} \
            vendor-wheels vendor-sources
          python3 -m pip download --dest vendor-wheels --only-binary=:all: --no-deps \
            --platform "${GRPC_PLATFORM}" --implementation cp \
            --python-version "${PYTHON_ABI}" --abi "cp${PYTHON_ABI}" \
            'grpcio==1.76.0'
          # etcd3 0.12.0 is published as a source distribution only. It is
          # pure Python; extract the module directly instead of invoking its
          # unnecessary and slower PEP 517 wheel build environment.
          curl --fail --show-error --location --retry 3 \
            --output vendor-sources/etcd3-0.12.0.tar.gz \
            'https://files.pythonhosted.org/packages/9c/eb/6d1ef4d6a3e8b74e45c502cbd3ea6c5c6c786d003829db9369c2530f5e3f/etcd3-0.12.0.tar.gz'
          printf '%s  %s\n' \
            '89a704cb389bf0a010a1fa050ce19342d23bf6371ebda1c21cfe8ff3ed488726' \
            'vendor-sources/etcd3-0.12.0.tar.gz' | sha256sum --check
          tar --extract --gzip --file vendor-sources/etcd3-0.12.0.tar.gz \
            --directory vendor-sources
          cp -a vendor-sources/etcd3-0.12.0/etcd3 \
            alternative/openwrt-lite/vendor/etcd3/
          python3 -m pip download --dest vendor-wheels --only-binary=:all: --no-deps \
            'protobuf==3.20.3' 'six==1.17.0' 'tenacity==9.1.2' \
            'typing-extensions==4.15.0'
          python3 - <<'PY'
          import pathlib
          import zipfile

          root = pathlib.Path('alternative/openwrt-lite/vendor')
          for wheel in pathlib.Path('vendor-wheels').glob('*.whl'):
              normalized = wheel.name.lower().replace('_', '-')
              if normalized.startswith('grpcio-'):
                  destination = root / 'grpcio'
              elif normalized.startswith('protobuf-'):
                  destination = root / 'protobuf'
              elif normalized.startswith('six-'):
                  destination = root / 'six'
              elif normalized.startswith('tenacity-'):
                  destination = root / 'tenacity'
              elif normalized.startswith('typing-extensions-'):
                  destination = root / 'typing-extensions'
              else:
                  raise SystemExit(f'unmapped Python wheel: {wheel}')
              with zipfile.ZipFile(wheel) as archive:
                  archive.extractall(destination)
          cygrpc = list((root / 'grpcio').glob('grpc/_cython/cygrpc*.so'))
          if len(cygrpc) != 1:
              raise SystemExit(f'expected one bundled cygrpc extension, found: {cygrpc}')
          print(f'bundled native gRPC extension: {cygrpc[0]}')
          PY
          while IFS= read -r -d '' shared_object; do
            while IFS= read -r needed; do
              case "${needed}" in
                libc.musl-*.so.1)
                  patchelf --replace-needed "${needed}" libc.so "${shared_object}"
                  ;;
                libc.so.6|libm.so.6)
                  patchelf --replace-needed "${needed}" libc.so "${shared_object}"
                  ;;
              esac
            done < <(patchelf --print-needed "${shared_object}")
          done < <(find alternative/openwrt-lite/vendor -type f -name '*.so' -print0)
          while IFS= read -r -d '' shared_object; do
            if patchelf --print-needed "${shared_object}" \
              | grep -q '^libc\.musl-.*\.so\.1$'; then
              echo "Foreign musl libc SONAME remains in ${shared_object}" >&2
              exit 1
            fi
            if patchelf --print-needed "${shared_object}" \
              | grep -Eq '^(libc|libm)\.so\.6$'; then
              echo "glibc-linked library is not valid on OpenWrt musl: ${shared_object}" >&2
              patchelf --print-needed "${shared_object}" >&2
              exit 1
            fi
          done < <(find alternative/openwrt-lite/vendor -type f -name '*.so' -print0)
          cd openwrt-sdk
          rm -rf package/meduza-openwrt-lite
          cp -a ../alternative/openwrt-lite package/meduza-openwrt-lite
          printf '%s\n' \
            'CONFIG_PACKAGE_meduza-openwrt-lite=m' \
            'CONFIG_PACKAGE_python3-etcd3=m' \
            'CONFIG_PACKAGE_python3-grpcio=m' \
            'CONFIG_PACKAGE_python3-protobuf=m' \
            'CONFIG_PACKAGE_python3-six=m' \
            'CONFIG_PACKAGE_python3-tenacity=m' \
            'CONFIG_PACKAGE_python3-typing-extensions=m' >.config
          make defconfig

      - name: Compile package
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build-artifact
          make -C openwrt-sdk package/meduza-openwrt-lite/compile \
            MEDUZA_PKGARCH="${PACKAGE_METADATA_ARCH}" \
            -j"$(nproc)" V=s 2>&1 | tee build-artifact/build.log

      - name: Collect packages
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-artifact/packages

          package_names=(meduza-openwrt-lite python3-etcd3 python3-grpcio \
            python3-protobuf python3-six python3-tenacity python3-typing-extensions)

          # Some vendor OpenWrt APK implementations reject external packages
          # tagged with OpenWrt's feed architecture even when apk --print-arch
          # reports the same CPU family. APK artifacts therefore use noarch
          # metadata for compatibility, while the filename retains the actual
          # grpcio CPU architecture and must be selected accordingly.
          if [[ "${PACKAGE_FORMAT}" == "apk" ]]; then
            grep -Eq -- "--info[[:space:]]+\"?arch:${PACKAGE_METADATA_ARCH}\"?" \
              build-artifact/build.log || {
                echo "APK metadata architecture is not ${PACKAGE_METADATA_ARCH}" >&2
                exit 1
              }
          elif ! find openwrt-sdk/bin -type f \
              -name "python3-grpcio_*_${PACKAGE_METADATA_ARCH}.ipk" -print -quit \
              | grep -q .; then
            echo "python3-grpcio IPK metadata architecture is not ${PACKAGE_METADATA_ARCH}" >&2
            exit 1
          fi
          release_date="$(date -u +%Y%m%d)"
          short_hash="${GITHUB_SHA:0:7}"
          package_files=()
          for package_name in "${package_names[@]}"; do
            case "${PACKAGE_FORMAT}" in
              ipk) source_pattern="${package_name}_*.ipk" ;;
              apk) source_pattern="${package_name}-*.apk" ;;
              *) echo "Unsupported package format: ${PACKAGE_FORMAT}" >&2; exit 1 ;;
            esac
            package_source="$(find openwrt-sdk/bin -type f -name "${source_pattern}" -print -quit)"
            test -n "${package_source}"
            package_filename="${package_name}-${release_date}-${short_hash}-${PACKAGE_ARCH}.${PACKAGE_FORMAT}"
            cp -v "${package_source}" "build-artifact/packages/${package_filename}"
            package_files+=("${package_filename}")
          done

          printf '%s\n' \
            "OpenWrt release: ${OPENWRT_RELEASE}" \
            "Target: ${OPENWRT_TARGET}/${OPENWRT_SUBTARGET}" \
            "Package format: ${PACKAGE_FORMAT}" \
            "Package architecture family: ${PACKAGE_ARCH}" \
            "Package metadata architecture: ${PACKAGE_METADATA_ARCH}" \
            "Package files: ${package_files[*]}" \
            "SDK: ${{ steps.sdk.outputs.sdk_name }}" \
            "Commit: ${GITHUB_SHA}" >build-artifact/BUILD-INFO.txt
          cd build-artifact
          find packages -type f -print0 | sort -z | xargs -0 sha256sum >SHA256SUMS

      - name: Upload OpenWrt package artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: meduza-openwrt-lite-${{ env.OPENWRT_RELEASE }}-${{ env.PACKAGE_FORMAT }}-${{ env.PACKAGE_ARCH }}
          path: build-artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Upload failed build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meduza-openwrt-lite-build-log-${{ env.OPENWRT_RELEASE }}-${{ env.PACKAGE_FORMAT }}-${{ env.PACKAGE_ARCH }}
          path: build-artifact/build.log
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish APK and IPK release
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: ${{ needs.changes.outputs.affected == 'true' && github.event_name != 'pull_request' }}
    steps:
      - name: Download APK and IPK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: meduza-openwrt-lite-*-*-*
          path: release-assets
          merge-multiple: true

      - name: Prepare release metadata
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          release_date="$(date -u +%Y%m%d)"
          short_hash="${GITHUB_SHA:0:7}"
          release_name="${release_date}-${short_hash}"
          release_tag="meduza-openwrt-lite-${release_name}"
          test "$(find release-assets/packages -type f -name '*.apk' | wc -l)" -eq 14
          test "$(find release-assets/packages -type f -name '*.ipk' | wc -l)" -eq 14
          find release-assets/packages -type f \( -name '*.apk' -o -name '*.ipk' \) \
            -printf '%f\0' | sort -z | while IFS= read -r -d '' filename; do
              sha256sum "release-assets/packages/${filename}"
            done >release-assets/SHA256SUMS
          printf '%s\n' \
            "Release: ${release_name}" \
            "Commit: ${GITHUB_SHA}" \
            "Includes: OpenWrt APK and IPK packages" >release-assets/RELEASE-INFO.txt
          echo "name=${release_name}" >>"${GITHUB_OUTPUT}"
          echo "tag=${release_tag}" >>"${GITHUB_OUTPUT}"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          RELEASE_NAME: ${{ steps.release_meta.outputs.name }}
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" --target "${GITHUB_SHA}" \
              --title "${RELEASE_NAME}" --notes "Automated Meduza OpenWrt Lite APK/IPK build."
          fi
          gh release upload "${RELEASE_TAG}" --clobber \
            release-assets/packages/*.apk release-assets/packages/*.ipk \
            release-assets/SHA256SUMS release-assets/RELEASE-INFO.txt
