name: build-openwrt-lite

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      ipk_release:
        description: OpenWrt release used to build IPK
        required: true
        default: "24.10.0"
        type: string
      apk_release:
        description: OpenWrt release used to build APK
        required: true
        default: "25.12.2"
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: openwrt-lite-${{ github.ref }}-noarch
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      affected: ${{ steps.decide.outputs.affected }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect OpenWrt package changes
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}
        uses: dorny/paths-filter@v3
        with:
          filters: |
            affected:
              - 'alternative/openwrt-lite/**'
              - '.github/workflows/openwrt-lite.yml'

      - name: Decide whether to build OpenWrt package
        id: decide
        shell: bash
        env:
          FILTER_RESULT: ${{ steps.filter.outputs.affected }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" || "${GITHUB_REF}" == refs/tags/* ]]; then
            affected=true
          else
            affected="${FILTER_RESULT:-false}"
          fi
          echo "affected=${affected}" >>"${GITHUB_OUTPUT}"
          if [[ "${affected}" != "true" ]]; then
            echo "OpenWrt build skipped: no OpenWrt package files changed."
          fi

  build:
    name: OpenWrt ${{ matrix.release }} ${{ matrix.package_format }} noarch
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: changes
    if: ${{ needs.changes.outputs.affected == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_format: ipk
            release: ${{ inputs.ipk_release || '24.10.0' }}
          - package_format: apk
            release: ${{ inputs.apk_release || '25.12.2' }}
    env:
      OPENWRT_RELEASE: ${{ matrix.release }}
      OPENWRT_TARGET: x86
      OPENWRT_SUBTARGET: "64"
      PACKAGE_FORMAT: ${{ matrix.package_format }}
      DOWNLOAD_DIR: ${{ github.workspace }}/.openwrt-downloads

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SDK host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses-dev libssl-dev python3 python3-setuptools rsync \
            unzip zlib1g-dev file wget curl jq zstd

      - name: Cache OpenWrt SDK archive and downloads
        uses: actions/cache@v4
        with:
          path: |
            .openwrt-downloads
          key: openwrt-sdk-${{ env.OPENWRT_RELEASE }}-${{ env.OPENWRT_TARGET }}-${{ env.OPENWRT_SUBTARGET }}-${{ runner.os }}

      - name: Download and verify OpenWrt SDK
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          base="https://downloads.openwrt.org/releases/${OPENWRT_RELEASE}/targets/${OPENWRT_TARGET}/${OPENWRT_SUBTARGET}"
          mkdir -p "${DOWNLOAD_DIR}"

          sdk_name="$(curl --fail --silent --show-error --location "${base}/" \
            | grep -oE 'openwrt-sdk-[^" ]+\.tar\.(zst|xz)' \
            | sort -u \
            | head -n 1)"
          test -n "${sdk_name}"
          sdk_archive="${DOWNLOAD_DIR}/${sdk_name}"

          if [ ! -s "${sdk_archive}" ]; then
            curl --fail --show-error --location --retry 3 \
              --output "${sdk_archive}" "${base}/${sdk_name}"
          fi
          curl --fail --show-error --location --retry 3 \
            --output "${DOWNLOAD_DIR}/sha256sums" "${base}/sha256sums"
          expected="$(awk -v name="${sdk_name}" '
            {
              file=$2
              if (substr(file, 1, 1) == "*") file=substr(file, 2)
              if (substr(file, 1, 2) == "./") file=substr(file, 3)
              if (file == name) { print $1; exit }
            }
          ' "${DOWNLOAD_DIR}/sha256sums")"
          if [ -z "${expected}" ]; then
            echo "SDK checksum entry not found: ${sdk_name}" >&2
            grep -F "${sdk_name}" "${DOWNLOAD_DIR}/sha256sums" >&2 || true
            exit 1
          fi
          printf '%s  %s\n' "${expected}" "${sdk_archive}" | sha256sum --check

          rm -rf openwrt-sdk
          mkdir openwrt-sdk
          tar --extract --file "${sdk_archive}" --directory openwrt-sdk --strip-components=1
          mkdir -p "${DOWNLOAD_DIR}/dl"
          rm -rf openwrt-sdk/dl
          ln -s "${DOWNLOAD_DIR}/dl" openwrt-sdk/dl
          echo "sdk_name=${sdk_name}" >>"${GITHUB_OUTPUT}"

      - name: Install Meduza package definition
        shell: bash
        run: |
          set -euo pipefail
          cd openwrt-sdk
          rm -rf package/meduza-openwrt-lite
          cp -a ../alternative/openwrt-lite package/meduza-openwrt-lite
          printf '%s\n' 'CONFIG_PACKAGE_meduza-openwrt-lite=m' >.config
          make defconfig

      - name: Compile package
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build-artifact
          make -C openwrt-sdk package/meduza-openwrt-lite/compile \
            -j"$(nproc)" V=s 2>&1 | tee build-artifact/build.log

      - name: Collect packages and indexes
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-artifact/packages build-artifact/indexes

          case "${PACKAGE_FORMAT}" in
            ipk) source_pattern='meduza-openwrt-lite_*.ipk' ;;
            apk) source_pattern='meduza-openwrt-lite-*.apk' ;;
            *) echo "Unsupported package format: ${PACKAGE_FORMAT}" >&2; exit 1 ;;
          esac
          package_source="$(find openwrt-sdk/bin -type f -name "${source_pattern}" -print -quit)"
          test -n "${package_source}"
          release_date="$(date -u +%Y%m%d)"
          short_hash="${GITHUB_SHA:0:7}"
          package_filename="meduza-openwrt-lite-${release_date}-${short_hash}-noarch.${PACKAGE_FORMAT}"
          cp -v "${package_source}" "build-artifact/packages/${package_filename}"

          find openwrt-sdk/bin -type f \
            \( -name 'Packages' -o -name 'Packages.gz' -o -name 'Packages.manifest' \
               -o -name 'Packages.sig' -o -name 'packages.adb' \) \
            -exec cp --parents {} build-artifact/indexes/ \;

          printf '%s\n' \
            "OpenWrt release: ${OPENWRT_RELEASE}" \
            "Target: ${OPENWRT_TARGET}/${OPENWRT_SUBTARGET}" \
            "Package format: ${PACKAGE_FORMAT}" \
            "Package architecture: all (noarch)" \
            "Package file: ${package_filename}" \
            "SDK: ${{ steps.sdk.outputs.sdk_name }}" \
            "Commit: ${GITHUB_SHA}" >build-artifact/BUILD-INFO.txt
          cd build-artifact
          find packages indexes -type f -print0 | sort -z | xargs -0 sha256sum >SHA256SUMS

      - name: Upload OpenWrt package artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: meduza-openwrt-lite-${{ env.OPENWRT_RELEASE }}-${{ env.PACKAGE_FORMAT }}-noarch
          path: build-artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Upload failed build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meduza-openwrt-lite-build-log-${{ env.OPENWRT_RELEASE }}-${{ env.PACKAGE_FORMAT }}-noarch
          path: build-artifact/build.log
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish APK and IPK release
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: ${{ needs.changes.outputs.affected == 'true' && github.event_name != 'pull_request' }}
    steps:
      - name: Download APK and IPK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: meduza-openwrt-lite-*-*-noarch
          path: release-assets
          merge-multiple: true

      - name: Prepare release metadata
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          release_date="$(date -u +%Y%m%d)"
          short_hash="${GITHUB_SHA:0:7}"
          release_name="${release_date}-${short_hash}"
          release_tag="meduza-openwrt-lite-${release_name}"
          test -n "$(find release-assets/packages -type f -name '*.apk' -print -quit)"
          test -n "$(find release-assets/packages -type f -name '*.ipk' -print -quit)"
          find release-assets/packages -type f \( -name '*.apk' -o -name '*.ipk' \) \
            -printf '%f\0' | sort -z | while IFS= read -r -d '' filename; do
              sha256sum "release-assets/packages/${filename}"
            done >release-assets/SHA256SUMS
          printf '%s\n' \
            "Release: ${release_name}" \
            "Commit: ${GITHUB_SHA}" \
            "Includes: OpenWrt APK and IPK packages" >release-assets/RELEASE-INFO.txt
          echo "name=${release_name}" >>"${GITHUB_OUTPUT}"
          echo "tag=${release_tag}" >>"${GITHUB_OUTPUT}"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          RELEASE_NAME: ${{ steps.release_meta.outputs.name }}
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" --target "${GITHUB_SHA}" \
              --title "${RELEASE_NAME}" --notes "Automated Meduza OpenWrt Lite APK/IPK build."
          fi
          gh release upload "${RELEASE_TAG}" --clobber \
            release-assets/packages/*.apk release-assets/packages/*.ipk \
            release-assets/SHA256SUMS release-assets/RELEASE-INFO.txt
