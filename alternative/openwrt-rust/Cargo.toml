[package]
name = "meduza-openwrt"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Single-binary Meduza reconciler for OpenWrt"
license = "MIT"

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5.48", features = ["derive", "env"] }
etcd-client = { version = "0.19.0", default-features = false, features = ["tls"] }
hex = "0.4.3"
libc = "0.2.176"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["ansi", "env-filter", "fmt"] }
url = "2.5.7"

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

[profile.release.package."*"]
opt-level = "z"
